[project]
name = "toptastic-bot"
version = "0.1.0"
description = "Automated scraper and YouTube enricher for the UK Singles Chart"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.198.0",
    "requests>=2.32.5",
    "rapidfuzz>=3.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv]
package = false
